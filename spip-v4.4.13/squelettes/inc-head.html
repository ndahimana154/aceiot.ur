<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[(#TITRE|?{ACEIoT})] — ACEIoT · University of Rwanda</title>
  <meta name="description" content="[(#DESCRIPTIF|?{ACEIoT at the University of Rwanda — postgraduate study, research, and partnerships in ICT and connected systems.})]" />

  <!-- Tailwind CSS CDN (v3 with config support) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ace: {
              primary:       '#0d6f94',
              'primary-dark':'#0a4760',
              secondary:     '#9f7a2f',
              text:          '#13313f',
              muted:         '#5f717a',
              'muted-strong':'#34505f',
              background:    '#f4f6f2',
              surface:       '#ffffff',
              card:          '#eef3f4',
              border:        '#d7e0e3',
              slate:         '#e8eeef',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '1.5rem',
            '4xl': '2rem',
            '5xl': '2.5rem',
          }
        }
      }
    }
  </script>

  <!-- CSS custom properties + body styles -->
  <style>
    :root {
      --ace-primary:        #0d6f94;
      --ace-primary-dark:   #0a4760;
      --ace-primary-soft:   rgba(13, 111, 148, 0.12);
      --ace-secondary:      #9f7a2f;
      --ace-secondary-soft: rgba(159, 122, 47, 0.12);
      --ace-text:           #13313f;
      --ace-muted:          #5f717a;
      --ace-muted-strong:   #34505f;
      --ace-background:     #f4f6f2;
      --ace-surface:        #ffffff;
      --ace-card:           #eef3f4;
      --ace-border:         #d7e0e3;
      --ace-slate:          #e8eeef;
    }
    html  { scroll-behavior: smooth; }
    body  {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at top, rgba(13,111,148,0.08), transparent 28%),
        linear-gradient(180deg, #f8f8f4 0%, var(--ace-background) 100%);
      color: var(--ace-text);
      min-height: 100vh;
      margin: 0;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--ace-primary-soft); }

    /* Utility shims used by many components */
    .ace-card {
      border-radius: 2rem;
      border: 1px solid var(--ace-border);
      background: var(--ace-surface);
      padding: 1.5rem;
      box-shadow: 0 16px 36px -28px rgba(19,49,63,0.45);
      transition: transform .35s, box-shadow .35s;
    }
    .ace-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 44px -26px rgba(13,111,148,0.24);
    }
    .ace-section-label {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--ace-primary);
      background: var(--ace-primary-soft);
      padding: .3rem .85rem;
      border-radius: 9999px;
    }
  </style>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="pt-[88px]">
<!-- /inc-head -->
