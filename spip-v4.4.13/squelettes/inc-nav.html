      a.classList.add('bg-[#0d6f94]', 'text-white');
    }
  });

  window.addEventListener('scroll', function () {
    nav.style.background = window.scrollY > 50 ? 'rgba(8,26,36,0.92)' : 'rgba(8,26,36,0.78)';
  });
}());
